{% extends 'students/base.html' %}

{% block title %}Add Expense | Office Finance{% endblock %}

{% block content %}
<div class="container-fluid" style="padding: 1.5rem 1rem; max-width: 700px; margin: 0 auto;">

    <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; margin-bottom: 1.5rem;">
        <div>
            <div style="font-size: 0.8rem; color: #64748b; margin-bottom: 0.2rem;">
                <a href="{% url 'fees:finance_dashboard' %}" style="color: #64748b; text-decoration: none;">Finance</a> / 
                <a href="{% url 'fees:expense_list' %}" style="color: #64748b; text-decoration: none;">Expenses</a> / Add
            </div>
            <h2 style="font-weight: 800; color: #0f172a; margin: 0; font-size: 1.45rem; display: flex; align-items: center; gap: 0.5rem;">
                <i class="fa-solid fa-circle-minus text-danger"></i> Add Expense Voucher
            </h2>
        </div>
        <div>
            <a href="{% url 'fees:expense_list' %}" class="btn btn-light btn-sm border text-muted" style="font-weight: 700; border-radius: 8px; padding: 0.45rem 0.9rem;">
                <i class="fa-solid fa-arrow-left me-1"></i> Expenses List
            </a>
        </div>
    </div>

    <div class="card border-0 shadow-sm" style="border-radius: 14px; background: white; padding: 1.75rem;">
        <form method="post">
            {% csrf_token %}

            <div class="mb-3">
                <label class="form-label fw-bold" style="font-size: 0.85rem; color: #334155;">Expense Category *</label>
                <select name="category" class="form-select" style="border-radius: 8px;" required>
                    {% for cat in categories %}
                    <option value="{{ cat.id }}">{{ cat.name }} ({{ cat.get_department_display }})</option>
                    {% endfor %}
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold" style="font-size: 0.85rem; color: #334155;">Amount (₹) *</label>
                <input type="number" step="0.01" min="1" name="amount" class="form-control form-control-lg fw-bold" placeholder="0.00" style="border-radius: 8px;" required>
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold" style="font-size: 0.85rem; color: #334155;">Paid To (Vendor / Person) *</label>
                <input type="text" name="paid_to" class="form-control" placeholder="e.g. Grocery Supplier, KSEB, Petrol Pump, Staff Name" style="border-radius: 8px;" required>
            </div>

            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <label class="form-label fw-bold" style="font-size: 0.85rem; color: #334155;">Payment Mode *</label>
                    <select name="payment_method" class="form-select" style="border-radius: 8px;" required>
                        <option value="cash" selected>💵 Cash</option>
                        <option value="bank_transfer">🏛️ Bank Transfer / NEFT</option>
                        <option value="upi">📱 UPI / GPay</option>
                        <option value="cheque">📝 Cheque</option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-bold" style="font-size: 0.85rem; color: #334155;">Voucher / Bill / Ref Number</label>
                    <input type="text" name="reference_number" class="form-control" placeholder="Voucher # or Bill No." style="border-radius: 8px;">
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label fw-bold" style="font-size: 0.85rem; color: #334155;">Remarks / Itemized Details</label>
                <textarea name="remarks" class="form-control" rows="2" placeholder="Item details, invoice references, purpose..." style="border-radius: 8px;"></textarea>
            </div>

            <div class="d-flex justify-content-between align-items-center">
                <a href="{% url 'fees:expense_list' %}" class="btn btn-light border text-muted" style="border-radius: 8px; font-weight: 600;">Cancel</a>
                <button type="submit" class="btn btn-danger fw-bold px-4" style="border-radius: 8px; background: #ef4444; border: none;">Save Expense Voucher</button>
            </div>
        </form>
    </div>

</div>
{% endblock %}
